<!-- Dual-tone module icons for the Frappe v16 Desk dock and sidebar headers.
     Matches ERPNext v16, HRMS v16, and Nest App sprite conventions: 24px grid, duotone symbols
     filled from duotone-light / duotone-dark CSS variables for sidebar headers, and soft symbols
     using shared soft-icon classes for the Dock. -->

<svg id="subscription-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		.shell-header:hover .header-logo,
		.shell-header.hover .header-logo {
			--duotone-light: light-dark(var(--ink-gray-3), var(--ink-gray-4));
		}
		.dock-item--duotone.active {
			--duotone-light: var(--ink-gray-4);
			--duotone-dark: light-dark(var(--ink-gray-6), var(--ink-gray-7));
		}
		.subscription-cycle-ring {
			transform-box: view-box;
			transform-origin: 12px 12px;
			transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
			transform: rotate(calc(var(--icon-motion-opacity, 0) * 28deg));
		}
		.subscription-setup-cog {
			transform-box: view-box;
			transform-origin: 16.5px 16.5px;
			animation: subscription-setup-turn 3s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes subscription-setup-turn {
			to { transform: rotate(360deg); }
		}
		@media (prefers-reduced-motion: reduce) {
			.subscription-cycle-ring {
				transition: none;
				transform: none;
			}
			.subscription-setup-cog {
				animation: none;
			}
		}
	</style>

	<!-- Subscription: circular renewal arrows around a recurring revenue coin -->
	<symbol viewBox="0 0 24 24" id="icon-subscription-duotone" stroke="none" style="overflow: visible">
		<circle cx="12" cy="12" r="5.6" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<path fill-rule="evenodd" d="M12 8.2a.75.75 0 0 1 .75.75v.35c.86.18 1.5.8 1.5 1.62a.75.75 0 0 1-1.5 0c0-.18-.28-.37-.75-.37s-.75.17-.75.34c0 .23.3.37.98.54 1.02.25 2.02.67 2.02 1.85 0 .88-.65 1.53-1.5 1.72v.35a.75.75 0 0 1-1.5 0V15c-.88-.18-1.52-.82-1.52-1.66a.75.75 0 0 1 1.5 0c0 .2.3.41.77.41.48 0 .75-.18.75-.37 0-.24-.28-.39-.98-.56-1.02-.25-2.02-.66-2.02-1.82 0-.85.64-1.48 1.5-1.68v-.37A.75.75 0 0 1 12 8.2Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="subscription-cycle-ring">
			<path d="M5.2 6.8A8.9 8.9 0 0 1 19.6 7.4l.95-1.05a.65.65 0 0 1 1.13.44v3.85a.65.65 0 0 1-.65.65h-3.85a.65.65 0 0 1-.45-1.12l1.28-1.28A6.9 6.9 0 0 0 6.8 8.2a1 1 0 1 1-1.6-1.4Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path d="M18.8 17.2A8.9 8.9 0 0 1 4.4 16.6l-.95 1.05a.65.65 0 0 1-1.13-.44v-3.85a.65.65 0 0 1 .65-.65h3.85a.65.65 0 0 1 .45 1.12l-1.28 1.28a6.9 6.9 0 0 0 11.21.69 1 1 0 1 1 1.6 1.4Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
	</symbol>

	<symbol id="icon-subscription-soft" viewBox="0 0 24 24" class="soft-icon">
		<circle cx="12" cy="12" r="5.5" class="soft-body" />
		<circle cx="12" cy="12" r="5.5" class="soft-accent" />
		<path d="M12 8.9v6.2M13.6 10.3c0-.66-.72-1.1-1.6-1.1s-1.6.44-1.6 1.05c0 1.25 3.2.88 3.2 2.2 0 .68-.72 1.15-1.6 1.15s-1.6-.47-1.6-1.12" />
		<g class="subscription-cycle-ring">
			<path d="M4.3 9.2A8.3 8.3 0 0 1 19.2 7.9" />
			<path d="M19.5 4.8v3.4h-3.4" class="soft-accent-line" />
			<path d="M19.7 14.8A8.3 8.3 0 0 1 4.8 16.1" />
			<path d="M4.5 19.2v-3.4h3.4" class="soft-accent-line" />
		</g>
	</symbol>

	<!-- Subscription Setup: recurring billing card with rotating cog -->
	<symbol viewBox="0 0 24 24" id="icon-subscription-setup-duotone" stroke="none" style="overflow: visible">
		<path fill-rule="evenodd" d="M3.5 4.2A2.2 2.2 0 0 1 5.7 2H15.3A2.2 2.2 0 0 1 17.5 4.2V9.8A6.6 6.6 0 0 0 9.6 18.5H5.7A2.2 2.2 0 0 1 3.5 16.3V4.2ZM5.8 6.2H15.2V8H5.8V6.2ZM5.8 10.4H10.2V12H5.8V10.4Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="subscription-setup-cog">
			<path fill-rule="evenodd" d="M15.6 10.2H17.4L17.8 11.9L19.2 12.5L20.7 11.6L22 12.9L21.1 14.4L21.7 15.8L23.4 16.2V18L21.7 18.4L21.1 19.8L22 21.3L20.7 22.6L19.2 21.7L17.8 22.3L17.4 24H15.6L15.2 22.3L13.8 21.7L12.3 22.6L11 21.3L11.9 19.8L11.3 18.4L9.6 18V16.2L11.3 15.8L11.9 14.4L11 12.9L12.3 11.6L13.8 12.5L15.2 11.9ZM16.5 15.1A2 2 0 1 0 16.5 19.1A2 2 0 1 0 16.5 15.1Z" transform="translate(0 -0.6) scale(0.94) translate(1 1)" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
	</symbol>

	<symbol id="icon-subscription-setup-soft" viewBox="0 0 24 24" class="soft-icon">
		<rect x="3.5" y="3" width="13.5" height="14.5" rx="2" class="soft-body" />
		<path d="M9.5 17.5H5.5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9.5a2 2 0 0 1 2 2v4.2M3.5 7.5h13.5M6.5 11.2h3.5" />
		<g class="subscription-setup-cog">
			<circle cx="16.5" cy="16.5" r="3.6" class="soft-accent" />
			<path d="M16.5 11v1.4m0 8.2V22m5.5-5.5h-1.4m-8.2 0H11m9.39-3.89-1 1m-5.78 5.78-1 1m7.78 0-1-1m-5.78-5.78-1-1" />
			<circle cx="16.5" cy="16.5" r="1.3" />
		</g>
	</symbol>
</svg>
