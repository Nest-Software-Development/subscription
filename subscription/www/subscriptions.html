    <link rel="apple-touch-startup-image" href="/assets/subscription/manifest/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/assets/subscription/manifest/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/assets/subscription/manifest/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/assets/subscription/manifest/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- Launch screen. Lives inline so it paints before JavaScript downloads.
         Selectors use classes only so Jinja never mistakes `{` + `#` for a comment. -->
    <style>
      html.is-splashing,
      html.is-splashing body,
      html:has([data-splash]),
      html:has([data-splash]) body {
        background-color: #0b1220 !important;
        margin: 0;
      }

      .sub-splash {
        position: fixed;
        top: calc(-1 * env(safe-area-inset-top, 0px));
        right: 0;
        bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
        left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        overflow: hidden;
        background: radial-gradient(130% 95% at 50% 40%, #1c2640 0%, #10192d 42%, #0b1220 100%);
        color: #ffffff;
        direction: ltr;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.58s ease, visibility 0s linear 0.58s;
      }
      .sub-splash-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .sub-splash-out .sub-splash-center {
        transform: scale(1.07);
        transition: transform 0.58s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Soft ambient auroras drifting behind the dot matrix */
      .sub-splash-aurora {
        position: absolute;
        border-radius: 50%;
        filter: blur(42px);
        opacity: 0;
        will-change: transform, opacity;
      }
      .sub-splash-aurora-a {
        width: 88vmax;
        height: 60vmax;
        top: -22vmax;
        left: -28vmax;
        background: radial-gradient(closest-side, rgba(255, 87, 87, 0.42), rgba(255, 87, 87, 0));
        animation: sub-in 1.5s ease 0.05s forwards, sub-drift-a 9s ease-in-out 0.05s infinite alternate;
      }
      .sub-splash-aurora-b {
        width: 82vmax;
        height: 68vmax;
        bottom: -32vmax;
        right: -28vmax;
        background: radial-gradient(closest-side, rgba(56, 189, 248, 0.28), rgba(56, 189, 248, 0));
        animation: sub-in 1.6s ease 0.2s forwards, sub-drift-b 11s ease-in-out 0.2s infinite alternate;
      }

      /* Fine dot grid brightest around the app icon */
      .sub-splash-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1.4px);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
        mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
        opacity: 0;
        animation: sub-in 1.4s ease 0.28s forwards;
      }

      /* Faint concentric renewal rings centered behind the icon */
      .sub-splash-rings {
        position: absolute;
        width: 150vmax;
        height: 150vmax;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: repeating-radial-gradient(
          circle,
          rgba(255, 255, 255, 0) 0 54px,
          rgba(255, 255, 255, 0.045) 55px 56px
        );
        opacity: 0;
        animation: sub-in 1.8s ease 0.36s forwards;
      }

      .sub-splash-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -5vh;
      }

      .sub-splash-icon {
        position: relative;
        width: clamp(106px, 29vw, 128px);
        aspect-ratio: 1;
        opacity: 0;
        transform: translateY(18px) scale(0.72);
        filter: blur(12px);
        animation:
          sub-rise-in 0.98s cubic-bezier(0.16, 1, 0.3, 1) 0.18s forwards,
          sub-float 4s ease-in-out 2.15s infinite;
        will-change: transform, filter, opacity;
      }

      /* Breathing coral halo behind the icon */
      .sub-splash-icon::before {
        content: '';
        position: absolute;
        inset: -38%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 87, 87, 0.44), rgba(255, 87, 87, 0));
        animation: sub-breathe 3.2s ease-in-out 1.15s infinite;
      }

      /* Subtle orbital cycle ring around the squircle */
      .sub-splash-orbit {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        border: 1px dashed rgba(255, 138, 138, 0.22);
        opacity: 0;
        animation:
          sub-in 0.9s ease 0.75s forwards,
          sub-spin 18s linear 0.75s infinite;
      }

      .sub-splash-tile {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 22%;
        overflow: hidden;
        box-shadow:
          0 24px 50px -14px rgba(0, 6, 24, 0.78),
          0 0 0 1px rgba(255, 255, 255, 0.15);
      }

      .sub-splash-logo {
        display: block;
        width: 100%;
        height: 100%;
        transform: scale(1.03);
      }

      /* Diagonal sweep of light across the icon */
      .sub-splash-sheen {
        position: absolute;
        top: -30%;
        left: -80%;
        width: 50%;
        height: 160%;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.52),
          rgba(255, 255, 255, 0)
        );
        transform: rotate(18deg);
        animation: sub-sheen 1.1s cubic-bezier(0.4, 0, 0.2, 1) 1.12s forwards;
      }

      /* Glowing line tracing around the squircle icon, then settling as a crisp rim */
      .sub-splash-trace {
        position: absolute;
        inset: -9px;
        width: calc(100% + 18px);
        height: calc(100% + 18px);
        overflow: visible;
        fill: none;
      }
      .sub-splash-trace rect {
        stroke: url(#sub-splash-trace-ink);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation:
          sub-trace 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.62s forwards,
          sub-settle-edge 0.8s ease 1.78s forwards;
      }

      .sub-splash-word {
        margin: 34px 0 0;
        overflow: hidden;
        display: flex;
        align-items: baseline;
        gap: 0.04em;
        padding-bottom: 0.1em;
        font-size: clamp(25px, 7vw, 31px);
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.12;
        text-transform: uppercase;
      }
      .sub-splash-word span {
        display: inline-block;
        transform: translateY(115%);
        animation: sub-slide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .sub-splash-word .sub-splash-accent {
        background: linear-gradient(90deg, #ff9a8b 0%, #ff5757 55%, #fb7185 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sub-splash-tag {
        margin: 10px 0 0;
        font-size: 13.5px;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.72);
        opacity: 0;
        transform: translateY(6px);
        animation: sub-fade-up 0.7s ease 1.42s forwards;
      }

      .sub-splash-bar {
        position: relative;
        margin-top: 32px;
        width: 124px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.13);
        opacity: 0;
        animation: sub-in 0.5s ease 1.65s forwards;
      }
      .sub-splash-bar i {
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(255, 87, 87, 0), #ff6b6b, rgba(255, 87, 87, 0));
        animation: sub-scan 1.35s cubic-bezier(0.45, 0, 0.55, 1) 1.65s infinite;
      }

      .sub-splash-by {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        opacity: 0;
        animation: sub-in 0.8s ease 1.85s forwards;
      }
      .sub-splash-by small {
        font-size: 10px;
        letter-spacing: 0.24em;
        color: rgba(255, 255, 255, 0.46);
      }
      .sub-splash-by span {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.13em;
        color: rgba(255, 255, 255, 0.8);
      }

      @keyframes sub-in {
        to {
          opacity: 1;
        }
      }
      @keyframes sub-rise-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }
      @keyframes sub-float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-5px) scale(1);
        }
      }
      @keyframes sub-breathe {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.09);
        }
      }
      @keyframes sub-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sub-sheen {
        to {
          left: 140%;
        }
      }
      @keyframes sub-trace {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes sub-settle-edge {
        to {
          opacity: 0.36;
        }
      }
      @keyframes sub-slide {
        to {
          transform: translateY(0);
        }
      }
      @keyframes sub-fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes sub-scan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes sub-drift-a {
        to {
          transform: translate(12vmax, 9vmax) scale(1.12);
        }
      }
      @keyframes sub-drift-b {
        to {
          transform: translate(-10vmax, -8vmax) scale(1.15);
        }
      }

      /* Reduced motion: show the calm finished frame without movement */
      @media (prefers-reduced-motion: reduce) {
        .sub-splash *,
        .sub-splash *::before {
          animation: none !important;
        }
        .sub-splash-aurora,
        .sub-splash-grid,
        .sub-splash-rings,
        .sub-splash-orbit,
        .sub-splash-icon,
        .sub-splash-tag,
        .sub-splash-bar,
        .sub-splash-by {
          opacity: 1;
          transform: none;
          filter: none;
        }
        .sub-splash-rings {
          transform: translate(-50%, -50%);
        }
        .sub-splash-word span {
          transform: none;
        }
        .sub-splash-trace rect {
          stroke-dashoffset: 0;
          opacity: 0.36;
        }
        .sub-splash-sheen,
        .sub-splash-bar i {
          display: none;
        }
        .sub-splash-out .sub-splash-center {
          transform: none;
        }
      }
    </style>
    <script>
      try {
        var savedTheme = localStorage.getItem('subscription:theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/subscription/frontend/assets/index-CftArGRn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/subscription/frontend/assets/index-CYEWRHNX.css">
  <link rel="manifest" href="/assets/subscription/frontend/manifest.webmanifest"></head>
  <body>
    <div class="sub-splash" data-splash role="status" aria-label="Subscription is loading">
      <div class="sub-splash-aurora sub-splash-aurora-a"></div>
      <div class="sub-splash-aurora sub-splash-aurora-b"></div>
      <div class="sub-splash-rings"></div>
      <div class="sub-splash-grid"></div>

      <div class="sub-splash-center" aria-hidden="true">
        <div class="sub-splash-icon">
          <div class="sub-splash-orbit"></div>
          <svg class="sub-splash-trace" viewBox="0 0 150 150" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sub-splash-trace-ink" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff9a8b" />
                <stop offset="0.5" stop-color="#ffffff" />
                <stop offset="1" stop-color="#ff5757" />
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="148" height="148" rx="34" pathLength="1" />
          </svg>
          <div class="sub-splash-tile">
            <img
              class="sub-splash-logo"
              src="/assets/subscription/images/subscription-logo-512.png"
              alt=""
              width="512"
              height="512"
              decoding="sync"
              fetchpriority="high"
            />
            <span class="sub-splash-sheen"></span>
          </div>
        </div>

        <p class="sub-splash-word">
          <span style="animation-delay: 0.92s">SUB</span><span class="sub-splash-accent" style="animation-delay: 1.06s">SCRIPTION</span>
        </p>
        <p class="sub-splash-tag">Recurring Revenue &amp; Renewal Intelligence</p>
        <div class="sub-splash-bar"><i></i></div>
      </div>

      <p class="sub-splash-by" aria-hidden="true">
        <small>FROM</small>
        <span>NSDLABS · NEST SOFTWARE DEVELOPMENT</span>
      </p>
    </div>
    <div id="app"></div>
    <script id="subscription-boot" type="application/json">{{ boot_json | safe }}</script>
  </body>
</html>
