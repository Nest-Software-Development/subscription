[project]
name = "subscription"
authors = [
    { name = "nsdLabs (Nest Software Development)", email = "info@nsd-eg.com" }
]
description = "Recurring client & vendor subscription management, multi-client cost allocation, wallets, renewal email automation, and native mobile PWA for ERPNext v16."
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pywebpush>=2.0.0",
]

[project.urls]
Homepage = "https://nsd-eg.com"
Repository = "https://github.com/Nest-Software-Development/subscription"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "B018", "B023", "B904", "E402", "E501", "E741", "F401", "F403", "F841", "UP030", "UP031", "UP032"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

